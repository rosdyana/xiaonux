<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>xiaonux</title>
  </head>
  <body>
    <header>
      <strong>xiaonux</strong>
      <button id="boot">Boot</button>
      <button id="reset" class="secondary">Reset machine</button>
      <label class="net">Network
        <select id="netmode">
          <option value="off">Off</option>
          <option value="helper">This computer (xiaonux-net)</option>
          <option value="relay" disabled>Relay (pip/apt/GitHub only)</option>
        </select>
      </label>
      <span id="netstatus"></span>
      <span id="status">idle</span>
      <span id="disk"></span>
      <span id="stats"></span>
    </header>
    <aside id="netpanel" hidden>
      <div>
        <strong>Internet is off.</strong>
        To use <code>pip</code>, <code>apt</code> or <code>curl</code>, run <b>xiaonux-net</b> on this computer.
        It shares your internet with this tab only and opens this page paired.
        <span id="netdl"></span>
      </div>
      <button id="netpanel-close" class="secondary" aria-label="Dismiss">Not now</button>
    </aside>
    <main id="term"></main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
